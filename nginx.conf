# Load balances HTTP + WebSocket traffic across N backend replicas
# (see docker-compose.yml's `backend` service `deploy.replicas`).
#
# ip_hash keeps a given client's WebSocket connection pinned to the same
# upstream for the life of that connection (WebSockets aren't request-based,
# so round-robin mid-connection would break them) — but any REST call, or a
# fresh reconnect, can land on a different replica. Cross-replica consistency
# for chat messages is handled by Redis pub/sub in the app layer, not here.

upstream backend_pool {
    ip_hash;
    server backend_1:8000;
    server backend_2:8000;
}

server {
    listen 80;

    location /ws/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
